# Free static site for KeyPrice scroll-hero clips.
# Headers are applied when this file is used as a Render Blueprint.
services:
  - type: web
    runtime: static
    name: keyprice-media
    buildCommand: "true"
    staticPublishPath: public
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: Access-Control-Allow-Methods
        value: GET, HEAD, OPTIONS
      - path: /*.mp4
        name: Content-Type
        value: video/mp4
      - path: /*.mp4
        name: Accept-Ranges
        value: bytes
      - path: /*.mp4
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=31536000, immutable
